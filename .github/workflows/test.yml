# Builds the firmware and the apps, and runs every test, on each pull
# request and on main: tools/*/run.sh, the emulator's RV32 interpreter test
# and the web flasher's test. It also checks that the layout tables are
# what tools/gen_layout.py makes from webui/board_data.js. The toolchain is Ubuntu's, as ch32fun's own CI
# uses. tools/board_test compares webui/board_data.js with the KiCad board,
# fetched from the public hardware repository.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the repository. The repository's default token can
# write, so every workflow declares its own permissions.
permissions:
  contents: read

# One run per branch or pull request at a time. A new push to a pull
# request cancels the run that is still going for it. On main a running
# run is not cancelled: a newer push waits for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:  # a required check on main: keep this job id
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # a run takes about 5 minutes
    env:
      PREFIX: riscv64-unknown-elf  # the Makefiles' default is riscv64-elf (Arch)
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get -yqq purge man-db || true  # its trigger is slow
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf libnewlib-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Layout tables match the board data
        run: |
          python3 tools/gen_layout.py
          git diff --exit-code -- layout.c webui/layout_data.js

      - name: Firmware
        run: |
          make MINICHLINK=ch32fun/minichlink ledmatrix.bin
          ls -l ledmatrix.bin

      - name: Apps
        run: make -C apps

      # For tools/board_test: the public hardware repository, at the commit
      # tools/extract_board_data.py names (HW_REV). An anonymous fetch: it
      # needs no token and no permission beyond the block above.
      - name: Hardware board
        run: |
          rev=$(python3 -c 'import sys; sys.path.insert(0, "tools"); import extract_board_data as e; print(e.HW_REV)')
          test -n "$rev"
          git init -q "$RUNNER_TEMP/hw"
          git -C "$RUNNER_TEMP/hw" fetch -q --depth 1 https://github.com/badgeteam/hackerhotel2027-hardware "$rev"
          echo "HH27_HW=$RUNNER_TEMP/hw" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          set -e
          node tools/isp_test/isp_test.js
          sh tools/emu/rv32_test/run.sh
          for t in tools/*/run.sh; do
            echo "::group::$t"
            sh "$t"
            echo "::endgroup::"
          done
